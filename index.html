<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coworking - Reservas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1000px;margin:auto;padding:25px 16px}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:20px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.card{background:#fff;padding:22px;border-radius:18px;border:1px solid #e4e8ee}.days,.slots{display:grid;gap:9px}.days{grid-template-columns:repeat(5,1fr);margin:18px 0}.slots{grid-template-columns:repeat(3,1fr)}button,input{font:inherit}button{padding:11px;border-radius:10px;border:1px solid #d7dce4;background:#fff;cursor:pointer}.day.active,.slot.selected,.primary{background:#172033;color:white}.slot.busy{background:#eef0f3;color:#8992a0;text-decoration:line-through}.primary{width:100%;border:0;margin-top:15px}input{width:100%;padding:11px;border:1px solid #d7dce4;border-radius:9px;box-sizing:border-box;margin:5px 0 12px}.summary{padding:13px;background:#f6f8fa;border-radius:10px}.msg{padding:12px;margin-top:12px;border-radius:10px}.ok{background:#e8f7ee;color:#176b3a}.err{background:#fff0f0;color:#a12a2a}.muted{color:#697386}.reservation{padding:10px 0;border-bottom:1px solid #edf0f3}
</style></head><body><div class="wrap">
<h2>Coworking · Sala 01</h2><div class="grid"><section class="card">
<h1>Reserve seu horário</h1><p class="muted">Os dados são compartilhados entre dispositivos.</p>
<div id="days" class="days"></div><h3>Horários</h3><div id="slots" class="slots"></div></section>
<aside class="card"><h3>Confirmar reserva</h3><div id="summary" class="summary">Selecione um horário.</div>
<label>Nome</label><input id="name" placeholder="Maria Silva"><label>E-mail</label><input id="email" type="email" placeholder="maria@email.com">
<button id="reserve" class="primary">Reservar horário</button><div id="msg"></div><h3>Reservas</h3><div id="list"></div></aside></div></div>
<script>
const SUPABASE_URL="https://yazwurspiuviohxyyjgt.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_X_vbBWPoBwTnjdzsKx47HA_CUeHwtxA";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const times=["08:00","09:00","10:00","11:00","13:00","14:00","15:00","16:00","17:00"];
const base=new Date();base.setHours(0,0,0,0);const dates=[0,1,2,3,4].map(i=>{let d=new Date(base);d.setDate(d.getDate()+i);return d});
let selectedDate=dates[0],selectedTime=null,res=[];
const key=d=>d.toISOString().slice(0,10), br=d=>d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
function message(t,ok=false){msg.className="msg "+(ok?"ok":"err");msg.textContent=t}
function render(){days.innerHTML=dates.map((d,i)=>`<button class="day ${key(d)==key(selectedDate)?"active":""}" onclick="pickDate(${i})">${i?"":"Hoje"}<br>${br(d)}</button>`).join("");
slots.innerHTML=times.map(t=>{let busy=res.some(r=>r.reservation_date==key(selectedDate)&&r.start_time.slice(0,5)==t);return `<button class="slot ${busy?"busy":""} ${selectedTime==t?"selected":""}" ${busy?"disabled":""} onclick="pickTime('${t}')">${busy?"Reservado":t}</button>`}).join("");
summary.innerHTML=selectedTime?`<b>${br(selectedDate)}</b><br>${selectedTime}`:"Selecione um horário.";
list.innerHTML=res.map(r=>`<div class="reservation"><b>${r.reservation_date.split("-").reverse().join("/")}</b> · ${r.start_time.slice(0,5)}<br>${r.name}</div>`).join("")||'<span class="muted">Nenhuma reserva.</span>'}
function pickDate(i){selectedDate=dates[i];selectedTime=null;render()} function pickTime(t){selectedTime=t;msg.textContent="";render()}
async function load(){if(!db){message("Configure SUPABASE_URL e SUPABASE_ANON_KEY no arquivo.");render();return}let q=await db.from("reservations").select("reservation_date,start_time,name").order("reservation_date").order("start_time");if(q.error)message(q.error.message);else{res=q.data||[];render()}}
reserve.onclick=async()=>{if(!db)return load();let n=name.value.trim(),e=email.value.trim();if(!selectedTime)return message("Selecione um horário.");if(!n||!e)return message("Informe nome e e-mail.");let q=await db.from("reservations").insert({room_id:1,reservation_date:key(selectedDate),start_time:selectedTime+":00",name:n,email:e});if(q.error){message(q.error.code==="23505"?"Esse horário já foi reservado.":q.error.message);return}message("Reserva confirmada!",true);name.value=email.value="";selectedTime=null;load()}
if(db)db.channel("reservas").on("postgres_changes",{event:"*",schema:"public",table:"reservations"},load).subscribe();
render();load();
</script></body></html>
