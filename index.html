<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coworking - Reservas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}
.wrap{max-width:1000px;margin:auto;padding:25px 16px}
.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:20px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:#fff;padding:22px;border-radius:18px;border:1px solid #e4e8ee}
.days,.slots{display:grid;gap:9px}
.days{grid-template-columns:repeat(7,1fr);margin:18px 0}
.slots{grid-template-columns:repeat(3,1fr)}
button,input{font:inherit}
button{padding:11px;border-radius:10px;border:1px solid #d7dce4;background:#fff;cursor:pointer}
button:disabled{cursor:not-allowed}
.day.active,.slot.selected,.primary{background:#172033;color:white}
.day.weekend{background:#f1f3f5;color:#929aa6}
.slot.busy{background:#eef0f3;color:#8992a0;text-decoration:line-through}
.primary{width:100%;border:0;margin-top:15px}
.primary:disabled{opacity:.65}
input{width:100%;padding:11px;border:1px solid #d7dce4;border-radius:9px;box-sizing:border-box;margin:5px 0 12px}
.summary{padding:13px;background:#f6f8fa;border-radius:10px}
.msg{padding:12px;margin-top:12px;border-radius:10px}
.ok{background:#e8f7ee;color:#176b3a}
.err{background:#fff0f0;color:#a12a2a}
.muted{color:#697386}
.reservation{padding:10px 0;border-bottom:1px solid #edf0f3}.cancel{margin-top:7px;padding:6px 9px;font-size:.9em;color:#a12a2a;border-color:#e7caca}
</style>
</head>
<body>
<div class="wrap">
<h2>Coworking · Sala 01</h2>

<div class="grid">
<section class="card">
<h1>Reserve seu horário</h1>
<p class="muted">Os dados são compartilhados entre dispositivos.</p>

<div id="days" class="days"></div>
<h3>Horários</h3>
<div id="slots" class="slots"></div>
</section>

<aside class="card">
<h3>Confirmar reserva</h3>
<div id="summary" class="summary">Selecione um horário.</div>

<label for="name">Nome</label>
<input id="name" placeholder="Maria Silva">

<label for="email">E-mail</label>
<input id="email" type="email" placeholder="maria@email.com">

<button id="reserve" class="primary">Reservar horário</button>

<div id="msg"></div>

<h3>Reservas</h3>
<div id="list"></div>
</aside>
</div>
</div>

<script>
const SUPABASE_URL = "https://yazwurspiuviohxyyjgt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_X_vbBWPoBwTnjdzsKx47HA_CUeHwtxA";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const daysEl = document.getElementById("days");
const slotsEl = document.getElementById("slots");
const summaryEl = document.getElementById("summary");
const nameEl = document.getElementById("name");
const emailEl = document.getElementById("email");
const reserveEl = document.getElementById("reserve");
const msgEl = document.getElementById("msg");
const listEl = document.getElementById("list");

const times = [
  "08:00","09:00","10:00","11:00",
  "13:00","14:00","15:00","16:00","17:00"
];

const base = new Date();
base.setHours(0,0,0,0);

const dates = [0,1,2,3,4,5,6].map(i => {
  const d = new Date(base);
  d.setDate(d.getDate() + i);
  return d;
});

let selectedDate = dates[0];
let selectedTime = null;
let reservations = [];

const key = d => d.toISOString().slice(0,10);

const br = d => d.toLocaleDateString("pt-BR", {
  day: "2-digit",
  month: "2-digit"
});

const weekday = d => d.toLocaleDateString("pt-BR", {
  weekday: "short"
}).replace(".", "");

const isWeekend = d => {
  const day = d.getDay();
  return day === 0 || day === 6;
};

function message(text, ok = false) {
  msgEl.className = "msg " + (ok ? "ok" : "err");
  msgEl.textContent = text;
}

function render() {

  daysEl.innerHTML = dates.map((d, i) => `
    <button
      type="button"
      class="day ${key(d) === key(selectedDate) ? "active" : ""} ${isWeekend(d) ? "weekend" : ""}"
      data-day="${i}"
      ${isWeekend(d) ? "disabled" : ""}>
      ${i === 0 ? `Hoje · ${weekday(d)}` : weekday(d)}<br>${br(d)}
    </button>
  `).join("");

  daysEl.querySelectorAll(".day").forEach(button => {
    button.addEventListener("click", () => {
      selectedDate = dates[Number(button.dataset.day)];
      selectedTime = null;
      msgEl.textContent = "";
      render();
    });
  });

  slotsEl.innerHTML = times.map(t => {

    const weekend = isWeekend(selectedDate);

    const busy = reservations.some(
      r =>
        r.reservation_date === key(selectedDate) &&
        r.start_time.slice(0,5) === t
    );

    // No dia de hoje, horários que já começaram ficam indisponíveis.
    const now = new Date();
    const isToday = key(selectedDate) === key(now);
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const [hour, minute] = t.split(":").map(Number);
    const slotMinutes = hour * 60 + minute;
    const passed = isToday && slotMinutes <= currentMinutes;
    const unavailable = weekend || busy || passed;

    return `
      <button
        type="button"
        class="slot ${unavailable ? "busy" : ""} ${selectedTime === t ? "selected" : ""}"
        data-time="${t}"
        ${unavailable ? "disabled" : ""}>
        ${weekend ? "Fim de semana" : busy ? "Reservado" : passed ? "Encerrado" : t}
      </button>
    `;

  }).join("");

  slotsEl.querySelectorAll(".slot:not(:disabled)").forEach(button => {
    button.addEventListener("click", () => {
      selectedTime = button.dataset.time;
      msgEl.textContent = "";
      render();
    });
  });

  summaryEl.innerHTML = selectedTime
    ? `<b>${br(selectedDate)}</b><br>${selectedTime}`
    : "Selecione um horário.";

  reserveEl.disabled = !selectedTime || isWeekend(selectedDate);

  const selectedReservations = reservations.filter(
    r => r.reservation_date === key(selectedDate)
  );

  listEl.innerHTML =
    selectedReservations.map(r => `
      <div class="reservation">
        <b>${r.reservation_date.split("-").reverse().join("/")}</b>
        · ${r.start_time.slice(0,5)}
        <br>${r.name}
        <br><button type="button" class="cancel" data-id="${r.id}">Cancelar</button>
      </div>
    `).join("")
    || '<span class="muted">Nenhuma reserva para este dia.</span>';

  listEl.querySelectorAll(".cancel").forEach(button => {
    button.addEventListener("click", async () => {
      const reservation = reservations.find(r => r.id === button.dataset.id);
      if (!reservation) return;

      const email = prompt(
        `Para cancelar a reserva de ${reservation.name}, informe o e-mail usado na reserva:`
      );

      if (email === null) return;

      const normalizedEmail = email.trim().toLowerCase();
      if (!normalizedEmail) {
        message("Informe o e-mail usado na reserva.");
        return;
      }

      button.disabled = true;
      button.textContent = "Cancelando...";

      const result = await db.rpc("cancel_reservation", {
        p_reservation_id: reservation.id,
        p_email: normalizedEmail
      });

      if (result.error) {
        console.error(result.error);
        message("Erro ao cancelar: " + result.error.message);
        button.disabled = false;
        button.textContent = "Cancelar";
        return;
      }

      if (!result.data) {
        message("Não foi possível cancelar. Confira o e-mail informado.");
        button.disabled = false;
        button.textContent = "Cancelar";
        return;
      }

      message("Reserva cancelada.", true);
      selectedTime = null;
      await load();
    });
  });
}

async function load() {

  const result = await db
    .from("reservations")
    .select("id,reservation_date,start_time,name")
    .order("reservation_date")
    .order("start_time");

  if (result.error) {
    console.error(result.error);
    message("Erro ao carregar reservas: " + result.error.message);
    render();
    return;
  }

  reservations = result.data || [];
  render();
}

reserveEl.addEventListener("click", async () => {

  msgEl.textContent = "";

  const name = nameEl.value.trim();
  const email = emailEl.value.trim();

  if (!selectedTime) {
    message("Selecione um horário.");
    return;
  }

  if (isWeekend(selectedDate)) {
    message("Não é possível agendar aos sábados e domingos.");
    return;
  }

  if (!name || !email) {
    message("Informe nome e e-mail.");
    return;
  }

  // Segunda proteção: impede uma reserva mesmo se o estado da tela estiver desatualizado.
  const now = new Date();
  const isToday = key(selectedDate) === key(now);
  const currentMinutes = now.getHours() * 60 + now.getMinutes();
  const [hour, minute] = selectedTime.split(":").map(Number);
  const slotMinutes = hour * 60 + minute;

  if (isToday && slotMinutes <= currentMinutes) {
    message("Esse horário já passou.");
    selectedTime = null;
    render();
    return;
  }

  reserveEl.disabled = true;
  reserveEl.textContent = "Reservando...";

  try {

    const result = await db
      .from("reservations")
      .insert({
        room_id: 1,
        reservation_date: key(selectedDate),
        start_time: selectedTime + ":00",
        name: name,
        email: email
      });

    if (result.error) {

      console.error(result.error);

      if (result.error.code === "23505") {
        message("Esse horário já foi reservado.");
      } else {
        message("Erro ao reservar: " + result.error.message);
      }

      return;
    }

    message("Reserva confirmada!", true);

    nameEl.value = "";
    emailEl.value = "";
    selectedTime = null;

    await load();

  } catch (error) {

    console.error(error);
    message("Erro inesperado ao fazer a reserva.");

  } finally {

    reserveEl.disabled = false;
    reserveEl.textContent = "Reservar horário";
  }
});

render();
load();

db.channel("reservas")
  .on(
    "postgres_changes",
    {
      event: "*",
      schema: "public",
      table: "reservations"
    },
    () => load()
  )
  .subscribe();
</script>

</body>
</html>
